<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTG — Global Vision Christian School - Mungyeong Campus</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="site-nav" aria-label="Site">
  <a class="nav-logo-link logo-mark" href="admin.html" aria-label="Student council login"></a>
  <div class="school-name">Global Vision Christian School - Mungyeong Campus</div>
  <div class="nav-links">
    <a class="nav-link is-current" href="index.html" data-i18n="nav_home">Home</a>
    <a class="nav-link" href="answers.html" data-i18n="nav_answers">Answers</a>
    <button class="lang-toggle" type="button" aria-label="Switch language">
      <span data-code="en">EN</span><span data-code="ko">KO</span>
    </button>
  </div>
</nav>

<header class="site-header">
  <span class="eyebrow" data-i18n="site_eyebrow">17th Student Council</span>
  <h1>CTG</h1>
  <p class="tagline" data-i18n="site_tagline1">Closer To God</p>
  
</header>

<nav class="doors" aria-label="Main actions">
  <a class="door" href="ask-the-pastor.html">
    <h2 data-i18n="door_ask_title">Ask the Pastor</h2>
    <p data-i18n="door_ask_sub">Private Q&amp;A</p>
  </a>
  <a class="door" href="send-your-prayer.html">
    <h2 data-i18n="door_prayer_title">Send Your Prayer</h2>
    <p data-i18n="door_prayer_sub">Private request</p>
  </a>
</nav>

<section class="new-section" aria-labelledby="new-heading">
  <div class="new-wrap">
    <h2 class="new-heading" id="new-heading" data-i18n="new_heading">New this week</h2>

    <div class="trouble" id="trouble" role="status"></div>

    <div class="ledger" id="ledger"></div>
    <p class="new-empty-note" id="new-empty" hidden>
      <span data-i18n="new_empty">Nothing new this week —</span>
      <a href="answers.html" data-i18n="new_empty_link">browse all answers</a>
    </p>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script src="i18n.js"></script>
<script>
  const ledger = document.getElementById('ledger');
  const newEmpty = document.getElementById('new-empty');
  let latestItems = [];

  function currentLangFields() {
    const lang = getLang();
    return lang === 'ko'
      ? { q: 'question_ko', a: 'answer_ko' }
      : { q: 'question_en', a: 'answer_en' };
  }

  function render() {
    const items = latestItems.filter(item => isWithinDays(item.date, 7));
    const { q, a } = currentLangFields();

    if (!items.length) {
      ledger.innerHTML = '';
      newEmpty.hidden = false;
      return;
    }
    newEmpty.hidden = true;

    ledger.innerHTML = items.map(item => `
      <div class="ledger-item" data-open="false" data-id="${item.id}">
        <button class="ledger-question" aria-expanded="false">
          <span class="ledger-flame" aria-hidden="true"></span>
          <span class="ledger-question-text">${escapeHtml(item[q])}</span>
          <span class="ledger-caret" aria-hidden="true">&#9656;</span>
        </button>
        <div class="ledger-answer">
          <div class="ledger-answer-inner">${escapeHtml(item[a])}</div>
        </div>
      </div>
    `).join('');

    ledger.querySelectorAll('.ledger-question').forEach(btn => {
      btn.addEventListener('click', () => {
        const parent = btn.closest('.ledger-item');
        const isOpen = parent.getAttribute('data-open') === 'true';
        parent.setAttribute('data-open', String(!isOpen));
        btn.setAttribute('aria-expanded', String(!isOpen));
      });
    });
  }

  if (CONFIG_OK) {
    PrayerBoard.onBoard(items => {
      hideTrouble('trouble');
      latestItems = items;
      render();
    }, err => showTrouble('trouble', err));
  } else {
    showTrouble('trouble', { code: 'config-missing',
      message: 'firebase-config.js did not load. Make sure it is in the same folder as this page.' });
  }

  document.addEventListener('ctg-lang-changed', render);
</script>
</body>
</html>
